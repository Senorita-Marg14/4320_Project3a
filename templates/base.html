<!DOCTYPE html>
<html lang="en">
<body>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Stock Data Visualizer {% endblock %}</title>
        <style>
            form {
                display: flex;
                flex-direction: column;
                background-color: lightgrey;
                padding: 4px;
                gap: 5px;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
            .note {
                display: flex;
                background-color: rgb(235, 235, 115);
                margin: 8px;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }

            .alert {
                display: flex;
                background-color: lightcoral;
                margin: 15px;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }

            header {
                display: flex;
                flex-direction: column;
                text-align: center;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }

        </style>
    </head>
        <header>
            <h1>Stock Data Visualizer</h1>
        </header>


        <hr>
        <div class="content">

            {% for message in get_flashed_messages() %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
            {% block content %} {% endblock %}
        </div>
</body>

</html>
