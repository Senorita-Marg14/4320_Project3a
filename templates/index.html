{% extends "base.html" %}

{% block title %}Stock Data Visuzalier{% endblock %}

{% block content %}
<div class="note">
    <p>Note: The Intraday option is now a Premium feature and is no longer supported by the Free API Key</p>
</div>
<form method="post">
    <label for="symbol">Choose Symbol</label>
    <select name="symbol" id="symbol">
        {% for symbol in symbols %}
            <option value="{{ symbol }}">{{ symbol }}</option>
        {% endfor %}
    </select>

    <label for="chart_type">Choose Chart Type</label>
    <select name="chart_type" id="chart_type">
            <option value="bar">Bar</option>
            <option value="line">Line</option>
    </select>

    <label for="time_series">Choose Time Series</label>
    <select name="time_series" id="time_series">
            <option value="1">Intraday</option>
            <option value="2">Daily</option>
            <option value="3">Weekly</option>
            <option value="4">Monthly</option>
    </select>

    <label for="start_date">Choose Start Date</label>
    <input type="date" name="start_date" id="start_date">

    <label for="end_date">Choose End Date</label>
    <input type="date" name="end_date" id="end_date">

    <button type="submit">Submit</button>
</form>

{%if chart %}
    <div id="chart">
        <embed type="image/svg+xml" src="{{ chart|safe }}" />
    </div>
{% endif %}

{% endblock %}
